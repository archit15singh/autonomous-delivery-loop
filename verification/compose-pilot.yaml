services:
  api:
    image: ${ADL_IMAGE:?}
    pull_policy: never
    labels:
      adl.run: ${ADL_PROJECT:?}
    environment:
      ADL_REVISION: ${ADL_REVISION:?}
      ADL_DEPLOYMENT: ${ADL_PROJECT:?}
      HOST: 0.0.0.0
      ADL_HOST: 0.0.0.0
      PORT: ${ADL_API_PORT:?}
      ADL_PORT: ${ADL_API_PORT:?}
      ADL_REDIS_HOST: "${ADL_REDIS_HOST-}"
      ADL_HEALTH_PATH: ${ADL_HEALTH_PATH:?}
    depends_on:
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + os.environ['ADL_HEALTH_PATH'], timeout=1)"]
      interval: 1s
      timeout: 2s
      retries: 10
    mem_limit: ${ADL_API_MEMORY:?}
    pids_limit: 64
    cpus: ${ADL_API_CPUS:?}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: &logs
      driver: json-file
      options: {max-size: "1m", max-file: "1"}
  probe:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    labels:
      adl.run: ${ADL_PROJECT:?}
    user: "65534:65534"
    environment:
      ADL_API_PORT: ${ADL_API_PORT:?}
      ADL_PROBE_PATHS: ${ADL_PROBE_PATHS:?}
    ports: ["127.0.0.1::8080"]
    networks: [default, probe]
    depends_on:
      api:
        condition: service_healthy
    command:
      - python
      - -I
      - -B
      - -c
      - |
        import json, os
        from http.client import HTTPConnection, HTTPException
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        paths = set(json.loads(os.environ["ADL_PROBE_PATHS"]))
        port = int(os.environ["ADL_API_PORT"])

        class ProbeRelay(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path not in paths:
                    self.send_error(404)
                    return
                upstream = HTTPConnection("api", port, timeout=4)
                try:
                    upstream.request("GET", self.path)
                    response = upstream.getresponse()
                    status, body = response.status, response.read(65537)
                except (OSError, HTTPException):
                    self.send_error(502)
                    return
                finally:
                    upstream.close()
                self.send_response(status)
                self.end_headers()
                self.wfile.write(body)

        ThreadingHTTPServer(("0.0.0.0", 8080), ProbeRelay).serve_forever()
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8080), 1).close()"]
      interval: 1s
      timeout: 2s
      retries: 5
    mem_limit: 32m
    pids_limit: 24
    cpus: 0.25
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logs
  redis:
    profiles: [redis]
    image: redis@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    labels:
      adl.run: ${ADL_PROJECT:?}
    command: [redis-server, --save, "", --appendonly, "no"]
    tmpfs: ["/data:size=16m"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 10
    mem_limit: 64m
    pids_limit: 32
    cpus: 0.5
    logging: *logs
networks:
  default:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      adl.run: ${ADL_PROJECT:?}
  probe:
    labels:
      adl.run: ${ADL_PROJECT:?}
