name: Runtime refinement eval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare live runtime verifier variants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOYMENT: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build the release candidate
        run: >-
          python -B -m delivery build --contract contracts/named-greeting.json
          --revision "$GITHUB_SHA" --deployment "$DEPLOYMENT" --output .adl/bundle
      - name: Run paired live trials and rollout controls
        run: >-
          python -B -m delivery.hillclimb --contract contracts/named-greeting.json
          --bundle .adl/bundle --output .adl/refinements.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: refinements-${{ env.DEPLOYMENT }}
          path: .adl/refinements.json
          include-hidden-files: true
          if-no-files-found: error
