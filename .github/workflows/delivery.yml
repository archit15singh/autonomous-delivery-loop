name: Delivery evidence

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  DEPLOYMENT: ${{ github.run_id }}-${{ github.run_attempt }}
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  build:
    name: Build and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m delivery factory self-check
      - name: Replay frozen factory incidents and held-out controls
        shell: bash
        run: |
          mkdir -p .adl/factory-replays
          python -m delivery factory benchmark --frozen evals/frozen.json > .adl/factory-replays/manifest.json
          while IFS= read -r case; do
            python -m delivery factory --output ".adl/factory-replays/$case.json" replay-change \
              --frozen evals/frozen.json --case "$case" --candidate "$REVISION" \
              --logs ".adl/factory-replays/$case"
          done < <(jq -r '.factory_replays[].id' .adl/factory-replays/manifest.json)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: factory-replays-${{ env.DEPLOYMENT }}
          path: .adl/factory-replays
          include-hidden-files: true
          if-no-files-found: ignore
      - run: python -m delivery build --revision "$REVISION" --deployment "$DEPLOYMENT" --output .adl/bundle
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bundle-${{ env.DEPLOYMENT }}
          path: .adl/bundle
          include-hidden-files: true
          if-no-files-found: error

  stage:
    name: Runtime evidence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'pull_request' && 'hosted-preview' || 'hosted-staging' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: bundle-${{ env.DEPLOYMENT }}
          path: .adl/bundle
      - name: Probe the deployed service
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
        run: |
          contract=contracts/pilot.json
          expected=0
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$RUN_REF" = refs/heads/main
            contract=contracts/staging-drill.json
            expected=1
          fi
          exit_code=0
          python -m delivery stage --contract "$contract" --bundle .adl/bundle \
            --revision "$REVISION" --deployment "$DEPLOYMENT" --output .adl/evidence.json || exit_code=$?
          test "$exit_code" = "$expected"
          if [[ "$expected" = 1 ]]; then
            jq -e '.verdict == "failed" and .reason == "probe_failed"' .adl/evidence.json
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: evidence-${{ env.DEPLOYMENT }}
          path: .adl/evidence.json
          include-hidden-files: true
          if-no-files-found: warn

  compose-pilot:
    name: Disposable Redis pilot
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify and clean up the exact candidate
        run: |
          python -m delivery factory compose-pilot --socket /var/run/docker.sock \
            --state .adl/compose-pilot/normal --revision "$REVISION" --runs .adl/compose-pilot/index
          PYTHONPATH=. python verification/compose-pilot-check.py "$REVISION" .adl/compose-pilot/drills
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: compose-pilot-${{ env.DEPLOYMENT }}
          path: .adl/compose-pilot
          include-hidden-files: true
          if-no-files-found: warn
