name: Delivery evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  DEPLOYMENT: ${{ github.run_id }}-${{ github.run_attempt }}
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  build:
    name: Build and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m delivery build --revision "$REVISION" --deployment "$DEPLOYMENT" --output .adl/bundle
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bundle-${{ env.DEPLOYMENT }}
          path: .adl/bundle
          include-hidden-files: true
          if-no-files-found: error

  stage:
    name: Runtime evidence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'push' && 'hosted-staging' || 'hosted-preview' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: bundle-${{ env.DEPLOYMENT }}
          path: .adl/bundle
      - run: >-
          python -m delivery stage --contract contracts/pilot.json --bundle .adl/bundle
          --revision "$REVISION" --deployment "$DEPLOYMENT" --output .adl/evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: evidence-${{ env.DEPLOYMENT }}
          path: .adl/evidence.json
          include-hidden-files: true
          if-no-files-found: warn
