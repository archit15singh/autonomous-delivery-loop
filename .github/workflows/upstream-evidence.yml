name: Upstream contribution evidence

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  dagger-sdk-node20-base:
    name: Reproduce the Dagger SDK engine mismatch on Node 20
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DAGGER_BASE: c1f8e9ae88f6c238ee02bef12ff131847052abc2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.20.2'
      - name: Fetch and verify the exact upstream revision
        run: |
          git init "$RUNNER_TEMP/dagger"
          git -C "$RUNNER_TEMP/dagger" fetch --depth 1 https://github.com/dagger/dagger.git "$DAGGER_BASE"
          git -C "$RUNNER_TEMP/dagger" sparse-checkout set sdk/typescript
          git -C "$RUNNER_TEMP/dagger" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/dagger" rev-parse HEAD)" = "$DAGGER_BASE"
      - name: Measure the actual frozen Yarn installation
        run: |
          output="$GITHUB_WORKSPACE/.adl/dagger-13610"
          mkdir -p "$output"
          cd "$RUNNER_TEMP/dagger/sdk/typescript"
          node --version | tee "$output/node.txt"
          node -p 'require("./package.json").engines.node' | tee "$output/declared-engine.txt"
          set +e
          npm exec --yes --package yarn@1.22.22 -- yarn install --frozen-lockfile --ignore-scripts 2>&1 | tee "$output/yarn.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          grep -F 'graphql@17.0.1: The engine "node" is incompatible' "$output/yarn.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dagger-13610-base
          path: .adl/dagger-13610
          if-no-files-found: warn
