name: Upstream contribution evidence

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  argo-nginx-restore:
    name: Verify the Argo Rollouts NGINX restore instructions
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ARGO_BASE: 8c9c5ad2182ba7757bb6a35e79d2051afc31feee
      ARGO_CANDIDATE: 7d64fd23f32237314b498053688c32fc29b1fdbd
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache: false
      - name: Fetch both exact public revisions
        run: |
          git init "$RUNNER_TEMP/argo"
          git -C "$RUNNER_TEMP/argo" fetch --depth 1 https://github.com/archit15singh/argo-rollouts.git "$ARGO_CANDIDATE"
          git -C "$RUNNER_TEMP/argo" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/argo" rev-parse HEAD)" = "$ARGO_CANDIDATE"
          git -C "$RUNNER_TEMP/argo" fetch --depth 1 https://github.com/argoproj/argo-rollouts.git "$ARGO_BASE"
          git -C "$RUNNER_TEMP/argo" worktree add --detach "$RUNNER_TEMP/argo-base" "$ARGO_BASE"
          test "$(git -C "$RUNNER_TEMP/argo-base" rev-parse HEAD)" = "$ARGO_BASE"
      - name: Build both documentation revisions
        run: |
          mkdir -p .adl/argo-4837
          python3 -m venv "$RUNNER_TEMP/mkdocs-env"
          source "$RUNNER_TEMP/mkdocs-env/bin/activate"
          pip install -r "$RUNNER_TEMP/argo/docs/requirements.txt"
          for revision in argo-base argo; do
            (cd "$RUNNER_TEMP/$revision" && mkdocs build --site-dir "$RUNNER_TEMP/$revision-site") \
              2>&1 | tee ".adl/argo-4837/$revision-build.log"
            cp "$RUNNER_TEMP/$revision-site/features/traffic-management/nginx/index.html" ".adl/argo-4837/$revision-nginx.html"
          done
          if grep -F 'id="restoring-a-rollout-and-its-ingresses"' .adl/argo-4837/argo-base-nginx.html; then exit 1; fi
          grep -F 'id="restoring-a-rollout-and-its-ingresses"' .adl/argo-4837/argo-nginx.html
      - name: Build and test the exact controller
        working-directory: ${{ runner.temp }}/argo
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/argo-rollouts-controller" ./cmd/rollouts-controller
          go test ./rollout/trafficrouting/nginx | tee "$GITHUB_WORKSPACE/.adl/argo-4837/go-test.log"
      - name: Exercise the documented owner check and recreation
        run: |
          bash verification/argo-4837.sh "$RUNNER_TEMP/argo" "$GITHUB_WORKSPACE/.adl/argo-4837" \
            2>&1 | tee .adl/argo-4837/live-replay.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: argo-nginx-restore
          path: .adl/argo-4837
          if-no-files-found: warn
