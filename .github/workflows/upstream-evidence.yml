name: Upstream contribution evidence

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  argo-analysis-docs:
    name: Verify Argo Rollouts metric-condition syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ARGO_BASE: 8c9c5ad2182ba7757bb6a35e79d2051afc31feee
      ARGO_CANDIDATE: 34e0ea257586a035bc3f5beb4824635e4a34fbeb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache: false
      - name: Fetch both exact public revisions
        run: |
          git init "$RUNNER_TEMP/argo"
          git -C "$RUNNER_TEMP/argo" fetch --depth 1 https://github.com/archit15singh/argo-rollouts.git "$ARGO_CANDIDATE"
          git -C "$RUNNER_TEMP/argo" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/argo" rev-parse HEAD)" = "$ARGO_CANDIDATE"
          git -C "$RUNNER_TEMP/argo" fetch --depth 1 https://github.com/argoproj/argo-rollouts.git "$ARGO_BASE"
          git -C "$RUNNER_TEMP/argo" worktree add --detach "$RUNNER_TEMP/argo-base" "$ARGO_BASE"
          test "$(git -C "$RUNNER_TEMP/argo-base" rev-parse HEAD)" = "$ARGO_BASE"
      - name: Build both documentation revisions
        run: |
          mkdir -p .adl/argo-1232
          python3 -m venv "$RUNNER_TEMP/mkdocs-env"
          source "$RUNNER_TEMP/mkdocs-env/bin/activate"
          pip install -r "$RUNNER_TEMP/argo/docs/requirements.txt"
          for revision in argo-base argo; do
            (cd "$RUNNER_TEMP/$revision" && mkdocs build --site-dir "$RUNNER_TEMP/$revision-site") \
              2>&1 | tee ".adl/argo-1232/$revision-build.log"
            cp "$RUNNER_TEMP/$revision-site/features/analysis/index.html" ".adl/argo-1232/$revision-analysis.html"
          done
          if grep -F 'id="metric-condition-expressions"' .adl/argo-1232/argo-base-analysis.html; then exit 1; fi
          grep -F 'id="metric-condition-expressions"' .adl/argo-1232/argo-analysis.html
      - name: Execute the documented expressions with the real evaluator
        working-directory: ${{ runner.temp }}/argo
        run: |
          cp "$GITHUB_WORKSPACE/verification/argo-1232-test.go.txt" utils/evaluate/adl_documented_test.go
          go test -v ./utils/evaluate | tee "$GITHUB_WORKSPACE/.adl/argo-1232/go-test.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: argo-analysis-docs
          path: .adl/argo-1232
          if-no-files-found: warn
