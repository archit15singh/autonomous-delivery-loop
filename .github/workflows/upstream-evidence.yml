name: Herdr Core Windows 2025 v143 evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '1'
  CARGO_PROFILE_TEST_DEBUG: '1'
  HC_TEST_WATCHDOG_S: '120'
  HC_TEST_SLOW_RUNNER: '1'

jobs:
  core-windows:
    name: Windows 2025 v143 replay (${{ matrix.lane }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: base, repo: herdrdev/herdr-core, sha: c7517808d64f06609e4ecf0db1757005373cc3a3}
    defaults:
      run:
        working-directory: core
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: core
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Verify revisions and compiler installation
        env:
          EXPECTED: ${{ matrix.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force '../.adl/herdr-core-windows' | Out-Null
          $observed = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $observed -ne $env:EXPECTED) {
            throw "Unexpected source revision $observed"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) {
            throw "Missing Visual Studio C++ build tools"
          }
          $toolsets = (Get-ChildItem "$installation\VC\Tools\MSVC" -Directory).Name -join ", "
          @(
            "Source: $observed"
            "Image: $env:ImageOS $env:ImageVersion"
            "Visual Studio: $installation"
            "Installed MSVC toolsets: $toolsets"
            (git submodule status)
            (rustc --version --verbose)
            "Zig: $(zig version)"
          ) | Tee-Object '../.adl/herdr-core-windows/versions.txt'
      - name: Select the installed v143 MSVC headers and libraries for Zig
        run: |
          $ErrorActionPreference = "Stop"
          $receipt = '../.adl/herdr-core-windows'
          $native = @(zig libc)
          if ($LASTEXITCODE -ne 0) { throw "Zig could not discover the runner SDK" }
          $native | Set-Content "$receipt/native-libc.txt"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw "Missing installed MSVC v143 component" }
          $toolsets = @(Get-ChildItem "$vs\VC\Tools\MSVC" -Directory -Filter '14.44.*' | Sort-Object Name -Descending)
          if ($toolsets.Count -eq 0) { throw "Missing MSVC 14.44 toolset directory" }
          $msvc = $toolsets[0].FullName
          if (-not (Test-Path "$msvc\include\cstring") -or -not (Test-Path "$msvc\lib\x64\vcruntime.lib")) {
            throw "Incomplete v143 headers or libraries"
          }
          $paths = Join-Path $env:RUNNER_TEMP 'zig-v143-libc.txt'
          $native | ForEach-Object {
            if ($_ -match '^sys_include_dir=') { "sys_include_dir=$msvc\include" }
            elseif ($_ -match '^msvc_lib_dir=') { "msvc_lib_dir=$msvc\lib\x64" }
            else { $_ }
          } | Set-Content $paths
          Get-Content $paths | Tee-Object "$receipt/v143-libc.txt"
          '#include <cstring>' | Set-Content "$env:RUNNER_TEMP\stl-probe.cpp"
          zig c++ -target x86_64-windows-msvc -fsyntax-only "$env:RUNNER_TEMP\stl-probe.cpp" *> "$receipt/native-stl.log"
          $nativeResult = $LASTEXITCODE
          Write-Output "Unmodified Zig C++ probe exit: $nativeResult"
          Get-Content "$receipt/native-stl.log"
          $env:ZIG_LIBC = $paths
          zig c++ -target x86_64-windows-msvc -fsyntax-only "$env:RUNNER_TEMP\stl-probe.cpp"
          if ($LASTEXITCODE -ne 0) { throw "Zig rejected the installed v143 C++ headers" }
          "ZIG_LIBC=$paths" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Clippy with Ghostty on the native toolchain
        run: |
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings 2>&1 |
            Tee-Object '../.adl/herdr-core-windows/clippy.log'
          exit $LASTEXITCODE
      - name: Install the project's pinned ConPTY
        run: ./scripts/fetch-conpty.ps1 -Dest target/x86_64-pc-windows-msvc/debug
      - name: Run the upstream Windows tests
        run: |
          cargo test --locked --no-fail-fast --target x86_64-pc-windows-msvc -- --test-threads 2 2>&1 |
            Tee-Object '../.adl/herdr-core-windows/tests.log'
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: herdr-core-windows-${{ matrix.lane }}
          path: .adl/herdr-core-windows
          include-hidden-files: true
