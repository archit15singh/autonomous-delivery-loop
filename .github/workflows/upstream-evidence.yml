name: Upstream contribution evidence

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  dagger-generate-version:
    name: Generate a version using the pinned Dagger release CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      DAGGER_CANDIDATE: dc17102593e2d7cf153e11be91e5be5a79bbad3a
      DAGGER_VERSION: 1.0.0-beta.28
      DAGGER_LINUX_SHA256: abd9f7e95f03c517e33cfbab0917fa1593d73e088d69304259884f8a47cc61a1
      SCHEMA_SOURCE_SHA: a84d72c63fede4c15d49bc212a6b4aaf391afe1d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch the exact public source
        run: |
          git init "$RUNNER_TEMP/dagger-source"
          git -C "$RUNNER_TEMP/dagger-source" fetch --depth 1 https://github.com/archit15singh/dagger.git "$DAGGER_CANDIDATE"
          git -C "$RUNNER_TEMP/dagger-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/dagger-source" rev-parse HEAD)" = "$DAGGER_CANDIDATE"
      - name: Fetch and verify the public Dagger CLI
        run: |
          archive="$RUNNER_TEMP/dagger-cli.tar.gz"
          curl -fsSL "https://dl.dagger.io/dagger/releases/$DAGGER_VERSION/dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$DAGGER_LINUX_SHA256" "$archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP" dagger
          "$RUNNER_TEMP/dagger" version
      - name: Generate an archive directly from the previous beta tag
        run: |
          output="$GITHUB_WORKSPACE/.adl/dagger-14081-generated"
          mkdir -p "$output"
          cd "$RUNNER_TEMP/dagger-source"
          "$RUNNER_TEMP/dagger" --progress=plain api call -m .dagger/modules/docs-dev \
            generate-version --source=https://github.com/dagger/dagger#v1.0.0-beta.27 --as=1.0-beta \
            after file --path=docs/versioned_docs/version-1.0-beta/schema.graphqls \
            export --path="$output/schema.graphqls" 2>&1 | tee "$output/generation.log"
          observed=$(git hash-object "$output/schema.graphqls")
          test "$observed" = "$SCHEMA_SOURCE_SHA"
          printf 'Generated schema blob from v1.0.0-beta.27: %s\n' "$observed" | tee "$output/audit.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dagger-14081-generation
          path: .adl/dagger-14081-generated
          if-no-files-found: warn
