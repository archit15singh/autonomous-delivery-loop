name: Upstream contribution evidence

on:
  pull_request:
    paths:
      - '.github/workflows/upstream-evidence.yml'
      - 'verification/pvlib-1606.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pvlib-1606:
    name: Reproduce pvlib collection failure and verify fix
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9.25'
      - run: bash verification/pvlib-1606.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pvlib-reproduction
          path: .adl/pvlib-evidence
          include-hidden-files: true
          if-no-files-found: warn
