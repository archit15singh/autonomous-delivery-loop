name: Herdr Core ls table replay

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ls-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BASE: c7517808d64f06609e4ecf0db1757005373cc3a3
      CANDIDATE: 811b8235db65698dd297ffc55b7ff7a065c04210
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: herdrdev/herdr-core
          ref: ${{ env.BASE }}
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Run the added assertion on the base and the exact candidate
        run: |
          mkdir -p "$RUNNER_TEMP/table-evidence"
          evidence="$RUNNER_TEMP/table-evidence"
          test "$(git rev-parse HEAD)" = "$BASE"
          git fetch --depth=1 https://github.com/archit15singh/herdr-core.git "$CANDIDATE"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          printf 'Base: %s\nCandidate: %s\n' "$BASE" "$CANDIDATE" | tee "$evidence/revisions.txt"
          git show "$CANDIDATE:crates/herdr-core/tests/m1.rs" > crates/herdr-core/tests/m1.rs
          if cargo test --locked -p herdr-core --test m1 ls_table_overrides_piped_output_without_changing_json_defaults -- --exact --nocapture > "$evidence/base.log" 2>&1; then
            echo "Expected the base to reject --table" >&2
            exit 1
          fi
          cat "$evidence/base.log"
          grep -F "unexpected argument '--table'" "$evidence/base.log"
          git restore crates/herdr-core/tests/m1.rs
          git checkout --detach "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          cargo fmt --all -- --check
          cargo test --locked -p herdr-core --test m1 ls_table_overrides_piped_output_without_changing_json_defaults -- --exact --nocapture 2>&1 | tee "$evidence/candidate.log"
          cargo test --locked -p herdr-core --test cli_docs 2>&1 | tee "$evidence/docs.log"
          core="$(realpath target/debug/herdr-core)"
          run_dir="$(mktemp -d /var/tmp/hc-table.XXXXXX)"
          export XDG_RUNTIME_DIR="$run_dir/run" XDG_STATE_HOME="$run_dir/state" XDG_CONFIG_HOME="$run_dir/config" HC_SESSION=table-replay
          trap '"$core" server stop >/dev/null 2>&1 || true' EXIT
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_STATE_HOME" "$XDG_CONFIG_HOME"
          "$core" run --bg --name table-probe --label 'where=workspace / terminal' -- sleep 100
          "$core" ls | tee "$evidence/default.json"
          "$core" ls --json | tee "$evidence/explicit.json"
          python3 - "$evidence/default.json" "$evidence/explicit.json" <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          for log in sys.argv[1:]:
              result = json.loads(Path(log).read_text())
              assert result["terminals"][0]["name"] == "table-probe"
          PYTHON
          "$core" ls --table | tee "$evidence/table.txt"
          grep -F 'workspace / terminal' "$evidence/table.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: herdr-table-343
          path: ${{ runner.temp }}/table-evidence
