name: Upstream contribution evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  herdr-core-305:
    name: Compare relay reconnect on two live cores
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: bash verification/herdr-core-305.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: reconnect-scrollback-evidence
          path: .adl/herdr-core-305-evidence
          include-hidden-files: true
          if-no-files-found: warn
