name: Herdr Core skill discovery replay

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  skill:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BASE: c7517808d64f06609e4ecf0db1757005373cc3a3
      CANDIDATE: c4feaa0fe48b05fc5b7866622fc5b78f5ed01e3c
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: herdrdev/herdr-core
          ref: ${{ env.BASE }}
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Run the added assertion on the base and the exact candidate
        run: |
          mkdir -p "$RUNNER_TEMP/skill-evidence"
          evidence="$RUNNER_TEMP/skill-evidence"
          test "$(git rev-parse HEAD)" = "$BASE"
          git fetch --depth=1 https://github.com/archit15singh/herdr-core.git "$CANDIDATE"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          printf 'Base: %s\nCandidate: %s\n' "$BASE" "$CANDIDATE" | tee "$evidence/revisions.txt"
          git show "$CANDIDATE:crates/herdr-core/tests/skill.rs" > crates/herdr-core/tests/skill.rs
          cargo build --locked -p herdr-core > "$evidence/base-build.log" 2>&1
          target/debug/herdr-core --skill > "$evidence/base-cli.md"
          if cargo test --locked -p herdr-core --test skill > "$evidence/base-test.log" 2>&1; then
            echo "Expected the base to fail the skill discovery regression" >&2
            exit 1
          fi
          cat "$evidence/base-test.log"
          grep -F 'host discovery must leave delegation to the host' "$evidence/base-test.log"
          git restore crates/herdr-core/tests/skill.rs
          git checkout --detach "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          cargo fmt --all -- --check
          cargo test --locked -p herdr-core --test skill 2>&1 | tee "$evidence/candidate-test.log"
          cargo build --locked -p herdr-core 2>&1 | tee "$evidence/candidate-build.log"
          target/debug/herdr-core --skill | tee "$evidence/candidate-cli.md"
          grep -Fx '## Delegate a task with hc' "$evidence/candidate-cli.md"
          grep -Fx '## Delegate a task' "$evidence/base-cli.md"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: herdr-skill-360
          path: ${{ runner.temp }}/skill-evidence
