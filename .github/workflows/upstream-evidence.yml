name: OpenCode composer benchmark parity

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  composer:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      BASE: b83ea513658eed65291d218d2363fc91c09a2141
      CANDIDATE: 39cf7a3c64128c0bce7bc6378488a3e72ed65b80
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: anomalyco/opencode
          ref: ${{ env.BASE }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: archit15singh/opencode
          ref: ${{ env.CANDIDATE }}
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Verify sources and install frozen dependencies
        run: |
          test "$(git -C base rev-parse HEAD)" = "$BASE"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/composer-evidence"
          printf 'Base: %s\nCandidate: %s\nBun: %s\n' "$BASE" "$CANDIDATE" "$(bun --version)" |
            tee "$RUNNER_TEMP/composer-evidence/revisions.txt"
          (cd base && bun install --frozen-lockfile)
          (cd candidate && bun install --frozen-lockfile)
      - name: Replay the built composer benchmark on both revisions
        working-directory: candidate
        run: |
          google-chrome --version
          bunx --no-install strobe bench packages/app/perf/composer.bench.ts \
            --base "$GITHUB_WORKSPACE/base" --head . --headless --check --repeat 2 \
            --noworse count.draft.encode --require-parity --max-time 15m \
            2>&1 | tee "$RUNNER_TEMP/composer-evidence/strobe.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: opencode-composer-parity
          path: ${{ runner.temp }}/composer-evidence
