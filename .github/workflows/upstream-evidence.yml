name: Upstream contribution evidence

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  dagger-versioned-api:
    name: Build Dagger docs and inspect versioned API on ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: base, repository: dagger/dagger, sha: c1f8e9ae88f6c238ee02bef12ff131847052abc2}
          - {mode: global, repository: archit15singh/dagger, sha: cca0d6fcf66848bacc5865bbcecd155a4979bbae}
          - {mode: candidate, repository: archit15singh/dagger, sha: d3e63374bbd83702d623858e7098fe642a801446}
    env:
      DAGGER_REVISION: ${{ matrix.sha }}
      DAGGER_REPOSITORY: ${{ matrix.repository }}
      DAGGER_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: Fetch and verify the exact revision
        run: |
          git init "$RUNNER_TEMP/dagger"
          git -C "$RUNNER_TEMP/dagger" fetch --depth 1 "https://github.com/$DAGGER_REPOSITORY.git" "$DAGGER_REVISION"
          git -C "$RUNNER_TEMP/dagger" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/dagger" rev-parse HEAD)" = "$DAGGER_REVISION"
      - name: Verify archived GraphQL source provenance
        if: matrix.mode != 'base'
        run: |
          while IFS=$'\t' read -r version tag commit expected; do
            local_schema="docs/versioned_docs/version-$version/schema.graphqls"
            observed=$(git -C "$RUNNER_TEMP/dagger" rev-parse "HEAD:$local_schema")
            test "$observed" = "$expected"
            printf '%s %s %s %s\n' "$version" "$tag" "$commit" "$observed"
          done < verification/dagger-14081-provenance.tsv
      - name: Compare published HTML routes
        run: |
          output="$GITHUB_WORKSPACE/.adl/dagger-14081"
          mkdir -p "$output"
          cd "$RUNNER_TEMP/dagger/docs"
          npm exec --yes --package yarn@1.22.22 -- yarn install --frozen-lockfile
          npm exec --yes --package yarn@1.22.22 -- yarn build
          cp build/reference/api/container/index.html "$output/released.html"
          cp build/next/reference/api/container/index.html "$output/next.html"
          node "$GITHUB_WORKSPACE/verification/dagger-14081.cjs" "$DAGGER_MODE" | tee "$output/audit.txt"
      - name: Verify loaded JavaScript in Chrome
        run: |
          google-chrome --version
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.58.2
          export PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/browser/node_modules/playwright"
          cd "$RUNNER_TEMP/dagger/docs"
          npm exec --yes --package yarn@1.22.22 -- yarn serve --host 127.0.0.1 --port 4173 --no-open &
          serve_pid=$!
          trap 'kill "$serve_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/reference/glossary/ -o /dev/null; then break; fi
            sleep 1
          done
          node "$GITHUB_WORKSPACE/verification/dagger-14081-browser.cjs" "$DAGGER_MODE" | tee "$GITHUB_WORKSPACE/.adl/dagger-14081/browser.jsonl"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dagger-14081-${{ matrix.mode }}
          path: .adl/dagger-14081
          if-no-files-found: warn
