name: Upstream contribution evidence

on:
  pull_request:
    paths:
      - '.github/workflows/upstream-evidence.yml'
      - 'verification/pvlib-1606.sh'
      - 'verification/act-6236.sh'
      - 'contracts/upstream/**'
      - 'delivery/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pvlib-1606:
    name: Reproduce pvlib collection failure and verify fix
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9.25'
      - run: bash verification/pvlib-1606.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pvlib-reproduction
          path: .adl/pvlib-evidence
          include-hidden-files: true
          if-no-files-found: warn

  act-6236:
    name: Verify Docker Hub auth in act's pull executor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.11'
          cache: false
      - run: bash verification/act-6236.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: act-docker-hub-reproduction
          path: .adl/act-6236-evidence
          include-hidden-files: true
          if-no-files-found: warn
